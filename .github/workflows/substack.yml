name: Sync Substack posts
on:
  schedule:
    - cron: '0 6 * * *'   # every morning at 06:00 UTC
  push:
    branches: [main]       # also re-sync whenever you upload or edit files
  workflow_dispatch:       # adds a "Run workflow" button on the Actions tab
permissions:
  contents: write
  pages: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 update_posts.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Sync Substack posts" || exit 0
          git push
          # Commits made by this workflow don't always trigger a site rebuild, so ask for one explicitly
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
